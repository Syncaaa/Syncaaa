<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="RTL to GDSII flow" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79c0ff"/><stop offset="1" stop-color="#388bfd"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .f{font-family:-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif}
      .box{fill:#0d1117;stroke:#1f3a5f;stroke-width:1.5}
      .lbl{fill:#f0f6fc;font-size:14px;font-weight:600;text-anchor:middle}
      .sub{fill:#8b949e;font-size:11px;text-anchor:middle}
      .rail{stroke:#1f3a5f;stroke-width:2}
      .hl{animation:hl 12s infinite;stroke:#1f3a5f}
      .s1{animation-delay:0s}.s2{animation-delay:2s}.s3{animation-delay:4s}
      .s4{animation-delay:6s}.s5{animation-delay:8s}.s6{animation-delay:10s}
      @keyframes hl{0%{stroke:#58a6ff;fill:#0f1f36}12%{stroke:#58a6ff;fill:#0f1f36}18%,100%{stroke:#1f3a5f;fill:#0d1117}}
    </style>
  </defs>
  <rect width="1200" height="170" rx="14" fill="#0d1117"/>
  <line class="rail" x1="100" y1="85" x2="1100" y2="85"/>

  <g class="f">
    <rect class="box hl s1" x="30"  y="48" width="140" height="74" rx="10"/><text class="lbl" x="100"  y="82">RTL</text><text class="sub" x="100"  y="102">Verilog / SV</text>
    <rect class="box hl s2" x="217" y="48" width="140" height="74" rx="10"/><text class="lbl" x="287"  y="82">Verification</text><text class="sub" x="287"  y="102">cocotb / UVM</text>
    <rect class="box hl s3" x="403" y="48" width="140" height="74" rx="10"/><text class="lbl" x="473"  y="82">Synthesis</text><text class="sub" x="473"  y="102">Yosys</text>
    <rect class="box hl s4" x="590" y="48" width="140" height="74" rx="10"/><text class="lbl" x="660"  y="82">Floorplan</text><text class="sub" x="660"  y="102">OpenROAD</text>
    <rect class="box hl s5" x="777" y="48" width="140" height="74" rx="10"/><text class="lbl" x="847"  y="82">Place &amp; Route</text><text class="sub" x="847"  y="102">CTS · timing</text>
    <rect class="box hl s6" x="963" y="48" width="140" height="74" rx="10"/><text class="lbl" x="1033" y="82">Signoff</text><text class="sub" x="1033" y="102">DRC / LVS → GDSII</text>
  </g>

  <circle r="5" cy="85" fill="url(#g)" filter="url(#glow)">
    <animate attributeName="cx" values="100;1033" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.97;1" dur="12s" repeatCount="indefinite"/>
  </circle>
</svg>

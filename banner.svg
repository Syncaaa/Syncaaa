<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Jean Lucas - Hardware and Chip Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0f1b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79c0ff"/>
      <stop offset="1" stop-color="#388bfd"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .f{font-family:-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif}
      .m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
      .trace{fill:none;stroke:#1c3556;stroke-width:1.5}
      .pulse{fill:none;stroke:#58a6ff;stroke-width:2;stroke-linecap:round;stroke-dasharray:10 300;animation:run 5s linear infinite}
      .pulse.b{animation-duration:7s;animation-delay:-2s;stroke:#79c0ff}
      .pulse.c{animation-duration:6s;animation-delay:-4s;stroke:#388bfd}
      @keyframes run{to{stroke-dashoffset:-310}}
      .border{fill:none;stroke:url(#accent);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:180 2400;animation:orbit 8s linear infinite}
      @keyframes orbit{to{stroke-dashoffset:-2580}}
      .breathe{animation:breathe 4s ease-in-out infinite}
      @keyframes breathe{0%,100%{opacity:.7}50%{opacity:1}}
      .cursor{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="278" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="278" rx="16" fill="none" stroke="#1f3a5f" stroke-width="1"/>
  <rect x="1" y="1" width="1198" height="278" rx="16" class="border" pathLength="2580"/>

  <!-- traces -->
  <path class="trace" d="M640 70 H760 V110 H880"/>
  <path class="trace" d="M600 140 H820 V140 H880"/>
  <path class="trace" d="M640 210 H760 V170 H880"/>
  <path class="trace" d="M1070 110 H1200"/>
  <path class="trace" d="M1070 170 H1200"/>
  <path class="pulse" d="M640 70 H760 V110 H880"/>
  <path class="pulse b" d="M600 140 H880"/>
  <path class="pulse c" d="M640 210 H760 V170 H880"/>
  <path class="pulse" style="animation-delay:-1s" d="M1070 110 H1200"/>
  <path class="pulse b" style="animation-delay:-3s" d="M1070 170 H1200"/>

  <!-- chip -->
  <g class="breathe">
    <rect x="880" y="90" width="190" height="100" rx="10" fill="#0d1117" stroke="#388bfd" stroke-width="1.5"/>
    <rect x="898" y="106" width="154" height="68" rx="6" fill="none" stroke="#1f3a5f"/>
    <text x="975" y="146" text-anchor="middle" class="m" font-size="18" font-weight="600" fill="#c9d1d9">ASIC</text>
    <text x="975" y="164" text-anchor="middle" class="m" font-size="10" fill="#58a6ff" letter-spacing="2">RTL → GDSII</text>
  </g>

  <!-- text -->
  <text x="60" y="125" class="f" font-size="58" font-weight="700" fill="#f0f6fc" letter-spacing="-1">Jean Lucas</text>
  <text x="62" y="165" class="f" font-size="22" fill="#79c0ff">Hardware Engineer <tspan fill="#8b949e">→</tspan> Chip Engineer</text>
  <rect x="62" y="186" width="56" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="62" y="222" class="m" font-size="14" fill="#8b949e" letter-spacing="1">RTL  ·  Verification  ·  Physical Design<tspan class="cursor" fill="#58a6ff"> _</tspan></text>
</svg>
